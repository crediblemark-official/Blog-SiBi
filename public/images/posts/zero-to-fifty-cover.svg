<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="lightZeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadowZero" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="750" fill="url(#lightZeroBg)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="0" x2="120" y2="750" />
    <line x1="320" y1="0" x2="320" y2="750" />
    <line x1="520" y1="0" x2="520" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="920" y1="0" x2="920" y2="750" />
    <line x1="1120" y1="0" x2="1120" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Ambient Glow Accent -->
  <circle cx="1020" cy="180" r="280" fill="#fef3c7" opacity="0.7" />
  <circle cx="180" cy="580" r="220" fill="#fffbeb" opacity="0.8" />

  <!-- Right Visual: Milestone Stepper Roadmap (Light) -->
  <g transform="translate(680, 130)">
    <!-- Milestone 1 -->
    <rect x="0" y="0" width="430" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowZero)" />
    <rect x="16" y="15" width="48" height="48" rx="14" fill="#fef3c7" />
    <text x="40" y="45" font-family="monospace" font-size="18" font-weight="900" fill="#d97706" text-anchor="middle">01</text>
    <text x="80" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Validasi Ide &amp; Pre-sale</text>
    <text x="80" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Nol modal • Dapatkan 10 pembeli pertama</text>

    <!-- Connector 1 -->
    <line x1="40" y1="78" x2="40" y2="98" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3" />

    <!-- Milestone 2 -->
    <rect x="0" y="98" width="430" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowZero)" />
    <rect x="16" y="113" width="48" height="48" rx="14" fill="#fef3c7" />
    <text x="40" y="143" font-family="monospace" font-size="18" font-weight="900" fill="#d97706" text-anchor="middle">02</text>
    <text x="80" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Ubah Followers Jadi Pembeli</text>
    <text x="80" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">100 pembeli loyal jauh lebih bernilai dari 100k pasif</text>

    <!-- Connector 2 -->
    <line x1="40" y1="176" x2="40" y2="196" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3" />

    <!-- Milestone 3 -->
    <rect x="0" y="196" width="430" height="78" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#softShadowZero)" />
    <rect x="16" y="211" width="48" height="48" rx="14" fill="#fffbeb" />
    <text x="40" y="241" font-family="monospace" font-size="18" font-weight="900" fill="#d97706" text-anchor="middle">03</text>
    <text x="80" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Landing Page Fokus Jualan</text>
    <text x="80" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#d97706" font-weight="600">Anti-ribet • Langsung to the point</text>

    <!-- Connector 3 -->
    <line x1="40" y1="274" x2="40" y2="294" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3" />

    <!-- Milestone 4 -->
    <rect x="0" y="294" width="430" height="78" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowZero)" />
    <rect x="16" y="309" width="48" height="48" rx="14" fill="#f8fafc" />
    <text x="40" y="339" font-family="monospace" font-size="18" font-weight="900" fill="#334155" text-anchor="middle">04</text>
    <text x="80" y="331" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">WhatsApp Closing Otomatis</text>
    <text x="80" y="351" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">QRIS instan • Tanpa begadang balas chat manual</text>

    <!-- Connector 4 -->
    <line x1="40" y1="372" x2="40" y2="392" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 3" />

    <!-- Milestone 5 (The 50 Juta Crown) -->
    <rect x="0" y="392" width="430" height="82" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#softShadowZero)" />
    <rect x="16" y="408" width="48" height="48" rx="14" fill="#fef3c7" />
    <text x="40" y="440" font-family="monospace" font-size="22" text-anchor="middle">👑</text>
    <text x="80" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="black" fill="#92400e">Order Bump &amp; Scaling 50 Juta</text>
    <text x="80" y="449" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309" font-weight="bold">Naikkan omzet 3x lipat per pembeli</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 210)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#d97706" />
    <text x="32" y="23" font-family="monospace" font-size="12" font-weight="bold" fill="#92400e">ROADMAP EKSEKUSI NYATA</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1">
      Zero to 50 Juta
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#brandAmber)" letter-spacing="-1">
      Produk Digital
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Panduan Langkah Demi Langkah dari 0
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Menghasilkan Omzet Puluhan Juta Mandiri
    </text>

    <!-- Bottom Feature Tags -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="130" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="65" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Validasi Cepat</text>

      <rect x="140" y="0" width="145" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="212" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Landing Page</text>

      <rect x="295" y="0" width="145" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="367" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Order Bump 3x</text>
    </g>
  </g>
</svg>
