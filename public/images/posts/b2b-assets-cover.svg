<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Light Base Brand Gradients -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="750" fill="url(#lightBg)" />

  <!-- Subtle Architectural Grid -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="0" x2="120" y2="750" />
    <line x1="320" y1="0" x2="320" y2="750" />
    <line x1="520" y1="0" x2="520" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="920" y1="0" x2="920" y2="750" />
    <line x1="1120" y1="0" x2="1120" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Ambient Amber Glow Accent -->
  <circle cx="1020" cy="180" r="260" fill="#fef3c7" opacity="0.6" />
  <circle cx="150" cy="620" r="220" fill="#fffbeb" opacity="0.8" />

  <!-- Right Visual: Enterprise B2B Cards (Light Foundation) -->
  <g transform="translate(680, 140)">
    <!-- Card 1: Compliance / SOP -->
    <rect x="0" y="0" width="430" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)" />
    <rect x="18" y="18" width="56" height="56" rx="14" fill="#fef3c7" />
    <text x="46" y="53" font-family="monospace" font-size="22" text-anchor="middle">📋</text>
    <text x="90" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Institutional Compliance SOP</text>
    <text x="90" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Audit-ready, legal terms &amp; BPOM/ISO</text>

    <!-- Card 2: Financial Model (Featured Active Card) -->
    <rect x="25" y="116" width="430" height="92" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#softShadow)" />
    <rect x="43" y="134" width="56" height="56" rx="14" fill="#fffbeb" />
    <text x="71" y="169" font-family="monospace" font-size="22" text-anchor="middle">📊</text>
    <text x="115" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">3-Statement Financial Engine</text>
    <text x="115" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#d97706" font-weight="600">DCF valuation &amp; dynamic burn runway</text>

    <!-- Card 3: Multi-Seat Licensing -->
    <rect x="10" y="232" width="430" height="92" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)" />
    <rect x="28" y="250" width="56" height="56" rx="14" fill="#f8fafc" />
    <text x="56" y="285" font-family="monospace" font-size="22" text-anchor="middle">🏢</text>
    <text x="100" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Multi-Seat Corporate License</text>
    <text x="100" y="297" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Tiered seats, annual SLA &amp; IP terms</text>

    <!-- Card 4: Instant Virtual Account Checkout -->
    <rect x="35" y="348" width="415" height="92" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadow)" />
    <rect x="53" y="366" width="56" height="56" rx="14" fill="#fef3c7" />
    <text x="81" y="401" font-family="monospace" font-size="22" text-anchor="middle">⚡</text>
    <text x="125" y="391" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#92400e">Direct Procurement Bypass</text>
    <text x="125" y="413" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309">Instant invoice &amp; zero commission</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 210)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="280" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#d97706" />
    <text x="32" y="23" font-family="monospace" font-size="12" font-weight="bold" fill="#92400e">MASTERCLASS B2B ASSETS</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1">
      B2B Digital
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#brandAmber)" letter-spacing="-1">
      Assets Playbook
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Membangun Aset Digital Bernilai Tinggi
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      untuk Korporasi &amp; Industri Tanpa Saingan
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="67" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Audit-Ready</text>

      <rect x="145" y="0" width="155" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="222" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Financial Models</text>

      <rect x="310" y="0" width="145" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="382" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Multi-Seat B2B</text>
    </g>
  </g>
</svg>
