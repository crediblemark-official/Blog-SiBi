<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="lightFunnelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadowFunnel" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="750" fill="url(#lightFunnelBg)" />
  
  <!-- Subtle Architectural Grids -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="100" y1="0" x2="100" y2="750" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="500" y1="0" x2="500" y2="750" />
    <line x1="700" y1="0" x2="700" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
    <line x1="1100" y1="0" x2="1100" y2="750" />
    <line x1="0" y1="125" x2="1200" y2="125" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="625" x2="1200" y2="625" />
  </g>

  <!-- Amber Ambient Accent -->
  <circle cx="1000" cy="200" r="280" fill="#fef3c7" opacity="0.7" />
  <circle cx="200" cy="580" r="220" fill="#fffbeb" opacity="0.8" />

  <!-- Funnel Node Graphics (Light Foundation) -->
  <g transform="translate(680, 150)">
    <!-- Stage 1 -->
    <rect x="0" y="0" width="440" height="68" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowFunnel)" />
    <rect x="16" y="16" width="36" height="36" rx="10" fill="#fef3c7" />
    <text x="34" y="39" font-family="monospace" font-size="14" font-weight="900" fill="#d97706" text-anchor="middle">01</text>
    <text x="68" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Traffic Ingestion &amp; Lead Magnet</text>
    <text x="390" y="40" font-family="monospace" font-size="13" font-weight="bold" fill="#64748b">100%</text>

    <!-- Connector 1 -->
    <path d="M 220 68 L 220 98" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Stage 2 -->
    <rect x="30" y="98" width="380" height="68" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#softShadowFunnel)" />
    <rect x="46" y="114" width="36" height="36" rx="10" fill="#fffbeb" />
    <text x="64" y="137" font-family="monospace" font-size="14" font-weight="900" fill="#d97706" text-anchor="middle">02</text>
    <text x="98" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Welcome Sequence 5-Hari</text>
    <text x="350" y="138" font-family="monospace" font-size="13" font-weight="bold" fill="#d97706">68%</text>

    <!-- Connector 2 -->
    <path d="M 220 166 L 220 196" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Stage 3 -->
    <rect x="60" y="196" width="320" height="68" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowFunnel)" />
    <rect x="76" y="212" width="36" height="36" rx="10" fill="#f8fafc" />
    <text x="94" y="235" font-family="monospace" font-size="14" font-weight="900" fill="#334155" text-anchor="middle">03</text>
    <text x="128" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Deadline &amp; Urgensi Etis</text>
    <text x="325" y="236" font-family="monospace" font-size="13" font-weight="bold" fill="#64748b">34%</text>

    <!-- Connector 3 -->
    <path d="M 220 264 L 220 294" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" />

    <!-- Stage 4 -->
    <rect x="90" y="294" width="260" height="68" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#softShadowFunnel)" />
    <rect x="106" y="310" width="36" height="36" rx="10" fill="#fef3c7" />
    <text x="124" y="333" font-family="monospace" font-size="14" font-weight="900" fill="#b45309" text-anchor="middle">04</text>
    <text x="156" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#92400e">WA Auto-Recovery</text>
    <text x="305" y="334" font-family="monospace" font-size="13" font-weight="bold" fill="#b45309">18%</text>

    <!-- Final Output Pill -->
    <g transform="translate(130, 385)">
      <rect x="0" y="0" width="180" height="40" rx="20" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadowFunnel)" />
      <text x="90" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">✨ High LTV Retention</text>
    </g>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 210)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="300" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#d97706" />
    <text x="32" y="23" font-family="monospace" font-size="12" font-weight="bold" fill="#92400e">MASTERCLASS SALES FUNNEL</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1">
      Sistem Penjualan
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#brandAmber)" letter-spacing="-1">
      Evergreen Otomatis
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Mesin Penjualan 24 Jam Tanpa Drama
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Peluncuran Berkala yang Menguras Tenaga
    </text>

    <!-- Bottom Feature Pills -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="145" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="72" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Arsitektur Funnel</text>

      <rect x="155" y="0" width="165" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="237" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Welcome Sequence</text>

      <rect x="330" y="0" width="135" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="397" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Otomasi WA</text>
    </g>
  </g>
</svg>
