<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="lightCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadowComp" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="750" fill="url(#lightCompBg)" />

  <!-- Subtle Grid -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="0" x2="120" y2="750" />
    <line x1="320" y1="0" x2="320" y2="750" />
    <line x1="520" y1="0" x2="520" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="920" y1="0" x2="920" y2="750" />
    <line x1="1120" y1="0" x2="1120" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="1020" cy="180" r="280" fill="#fef3c7" opacity="0.7" />
  <circle cx="180" cy="580" r="220" fill="#fffbeb" opacity="0.8" />

  <!-- Right Visual: Comparison Cards -->
  <g transform="translate(670, 130)">
    <!-- Card 1: Platform Pihak Ketiga (High Fee) -->
    <rect x="0" y="0" width="440" height="110" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#softShadowComp)" />
    <rect x="20" y="24" width="62" height="62" rx="14" fill="#fef2f2" />
    <text x="51" y="62" font-family="monospace" font-size="24" text-anchor="middle">📉</text>
    <text x="100" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Platform Pihak Ketiga (Lynk, Mayar, dll)</text>
    <text x="100" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#dc2626" font-weight="600">Komisi 3% - 10% + Tarik Dana + Data Terkunci</text>
    <text x="100" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Omzet Rp 20 Jt dipotong hingga Rp 2.000.000/bln</text>

    <!-- Card 2: Toko Mandiri SitusBisnis (Winner) -->
    <rect x="15" y="135" width="440" height="125" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" filter="url(#softShadowComp)" />
    <rect x="35" y="162" width="68" height="68" rx="14" fill="#fef3c7" />
    <text x="69" y="204" font-family="monospace" font-size="26" text-anchor="middle">👑</text>
    <text x="120" y="167" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">Toko Mandiri SitusBisnis</text>
    <text x="120" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#d97706" font-weight="700">0% Potongan Komisi Platform (Rp 0)</text>
    <text x="120" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#059669" font-weight="600">✓ 100% Data WhatsApp &amp; Email Milik Anda</text>
    <text x="120" y="228" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">✓ QRIS Langsung &amp; Akses Berkas Otomatis</text>

    <!-- Card 3: Kalkulasi Margin Bersih -->
    <rect x="0" y="285" width="440" height="100" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowComp)" />
    <rect x="20" y="304" width="62" height="62" rx="14" fill="#f8fafc" />
    <text x="51" y="342" font-family="monospace" font-size="24" text-anchor="middle">💰</text>
    <text x="100" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Efisiensi Profit Jangka Panjang</text>
    <text x="100" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0f172a" font-weight="600">Hemat Hingga Belasan Juta Rupiah per Tahun</text>
    <text x="100" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Margin laba utuh untuk biaya riset &amp; iklan mandiri</text>
  </g>

  <!-- Left Content: Typography & Value Props -->
  <g transform="translate(100, 160)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <circle cx="18" cy="18" r="6" fill="#d97706" />
    <text x="34" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#92400e" letter-spacing="0.5">RISET KOMPETITOR &amp; PLATFORM</text>

    <!-- Main Title Lines -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">Perbandingan Platform</text>
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#brandAmber)" letter-spacing="-1">Jual Produk Digital</text>
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">di Indonesia</text>

    <!-- Description -->
    <text x="0" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#475569">Bedah komparasi biaya transaksi, potongan komisi,</text>
    <text x="0" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#475569">kepemilikan database pembeli, dan kalkulasi profit riil.</text>

    <!-- Bullets -->
    <g transform="translate(0, 320)">
      <circle cx="10" cy="10" r="5" fill="#d97706" />
      <text x="26" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Lynk id vs Mayar vs KaryaKarsa vs Toko Mandiri</text>

      <circle cx="10" cy="38" r="5" fill="#d97706" />
      <text x="26" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Simulasi omzet Rp 20 juta dan potongan biaya bersih</text>

      <circle cx="10" cy="66" r="5" fill="#d97706" />
      <text x="26" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Kenapa toko mandiri 0% komisi adalah masa depan kreator</text>
    </g>
  </g>
</svg>
