<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="lightCompBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadowComp" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="750" fill="url(#lightCompBg)" />

  <!-- Subtle Grid -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="0" x2="120" y2="750" />
    <line x1="320" y1="0" x2="320" y2="750" />
    <line x1="520" y1="0" x2="520" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="920" y1="0" x2="920" y2="750" />
    <line x1="1120" y1="0" x2="1120" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="1020" cy="180" r="280" fill="#fef3c7" opacity="0.7" />
  <circle cx="180" cy="580" r="220" fill="#fffbeb" opacity="0.8" />

  <!-- Right Visual: Comparison Cards -->
  <g transform="translate(670, 110)">
    <!-- Card 1: Platform Lain (Lynk 3-5%, Mayar 3-4%, KK 10%) -->
    <rect x="0" y="0" width="440" height="110" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="1.5" filter="url(#softShadowComp)" />
    <rect x="20" y="24" width="62" height="62" rx="14" fill="#fef2f2" />
    <text x="51" y="62" font-family="monospace" font-size="24" text-anchor="middle">📉</text>
    <text x="100" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Platform Lain (Lynk, Mayar, KK)</text>
    <text x="100" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#dc2626" font-weight="600">Komisi 3% - 10% Terus Memotong Omzet</text>
    <text x="100" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">Lynk Pro tetap 3% • KaryaKarsa 10% • Data Terkunci</text>

    <!-- Card 2: SitusBisnis Pro Creator (Paling Populer) -->
    <rect x="15" y="130" width="440" height="125" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5" filter="url(#softShadowComp)" />
    <rect x="35" y="157" width="68" height="68" rx="14" fill="#fef3c7" />
    <text x="69" y="199" font-family="monospace" font-size="26" text-anchor="middle">⭐</text>
    <text x="120" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold" fill="#0f172a">SitusBisnis Pro Creator (Rp 79rb/bln)</text>
    <text x="120" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#d97706" font-weight="700">Fee Hanya 1% • White-Label Murni</text>
    <text x="120" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#059669" font-weight="600">✓ Kelola 3 Toko • Bebas Iklan • Unlimited Landing Page</text>
    <text x="120" y="223" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">✓ 25 GB Cloud S3 • 5.000 CRM Kontak • Custom Domain</text>

    <!-- Card 3: SitusBisnis Business Scale (Zero Fee) -->
    <rect x="0" y="275" width="440" height="115" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#softShadowComp)" />
    <rect x="20" y="297" width="68" height="68" rx="14" fill="#ecfdf5" />
    <text x="54" y="339" font-family="monospace" font-size="26" text-anchor="middle">👑</text>
    <text x="105" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">SitusBisnis Business Scale (Rp 199rb/bln)</text>
    <text x="105" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#059669" font-weight="700">0% Potongan Komisi (Zero Fee) ⭐</text>
    <text x="105" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#334155" font-weight="600">✓ Unlimited Produk &amp; Page • 10 Toko • 100 GB Cloud</text>
    <text x="105" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">✓ 25.000 CRM • 10 Akun Tim • Auto-Split Afiliasi 0%</text>
  </g>

  <!-- Left Content: Typography & Value Props -->
  <g transform="translate(100, 150)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <circle cx="18" cy="18" r="6" fill="#d97706" />
    <text x="34" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#92400e" letter-spacing="0.5">KOMPARASI BIAYA &amp; FITUR RIIL</text>

    <!-- Main Title Lines -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">Perbandingan Platform</text>
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#brandAmber)" letter-spacing="-1">Jual Produk Digital</text>
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="-1">di Indonesia</text>

    <!-- Description -->
    <text x="0" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#475569">Bedah akurat skema Starter (5%), Pro Creator (1%),</text>
    <text x="0" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="17" fill="#475569">hingga Business Scale (0% Zero Fee) vs Lynk.id &amp; Mayar.</text>

    <!-- Bullets -->
    <g transform="translate(0, 320)">
      <circle cx="10" cy="10" r="5" fill="#d97706" />
      <text x="26" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Data resmi fitur &amp; tabel komparasi biaya terbaru</text>

      <circle cx="10" cy="38" r="5" fill="#d97706" />
      <text x="26" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Simulasi profit riil omzet Rp 20 juta - Rp 50 juta</text>

      <circle cx="10" cy="66" r="5" fill="#d97706" />
      <text x="26" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#334155">Kepemilikan database CRM WhatsApp &amp; Custom Domain</text>
    </g>
  </g>
</svg>
