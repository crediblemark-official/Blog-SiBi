<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="lightCopyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="brandAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="softShadowCopy" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Clean Light Background -->
  <rect width="1200" height="750" fill="url(#lightCopyBg)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.45" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3">
    <line x1="120" y1="0" x2="120" y2="750" />
    <line x1="320" y1="0" x2="320" y2="750" />
    <line x1="520" y1="0" x2="520" y2="750" />
    <line x1="720" y1="0" x2="720" y2="750" />
    <line x1="920" y1="0" x2="920" y2="750" />
    <line x1="1120" y1="0" x2="1120" y2="750" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Ambient Glow Accent -->
  <circle cx="1000" cy="200" r="280" fill="#fef3c7" opacity="0.7" />
  <circle cx="200" cy="580" r="200" fill="#fffbeb" opacity="0.9" />

  <!-- Right Graphic: Copywriting Framework Cards (Light) -->
  <g transform="translate(680, 140)">
    <!-- Card 1: Hook -->
    <rect x="0" y="0" width="430" height="90" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowCopy)" />
    <rect x="18" y="17" width="56" height="56" rx="14" fill="#fef3c7" />
    <text x="46" y="52" font-family="monospace" font-size="22" text-anchor="middle">🎣</text>
    <text x="90" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">The 5-Second Attention Hook</text>
    <text x="90" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Menghentikan scroll &amp; menembus filter apatis</text>

    <!-- Card 2: Value Equation (Featured Active) -->
    <rect x="25" y="114" width="430" height="90" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#softShadowCopy)" />
    <rect x="43" y="131" width="56" height="56" rx="14" fill="#fffbeb" />
    <text x="71" y="166" font-family="monospace" font-size="22" text-anchor="middle">💎</text>
    <text x="115" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Grand Slam Offer Anatomy</text>
    <text x="115" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#d97706" font-weight="600">Dream Outcome ÷ Time &amp; Effort Friksi</text>

    <!-- Card 3: Objection Killer -->
    <rect x="10" y="228" width="430" height="90" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadowCopy)" />
    <rect x="28" y="245" width="56" height="56" rx="14" fill="#f8fafc" />
    <text x="56" y="280" font-family="monospace" font-size="22" text-anchor="middle">🛡️</text>
    <text x="100" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">5 Universal Objection Killers</text>
    <text x="100" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b">Garansi terbalik, bukti sosial &amp; FAQ presisi</text>

    <!-- Card 4: Microcopy CTA -->
    <rect x="35" y="342" width="410" height="90" rx="18" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#softShadowCopy)" />
    <rect x="53" y="359" width="56" height="56" rx="14" fill="#fef3c7" />
    <text x="81" y="394" font-family="monospace" font-size="22" text-anchor="middle">✍️</text>
    <text x="125" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#92400e">Microcopy &amp; Frictionless Checkout</text>
    <text x="125" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#b45309">Sihir 5 kata penutup konversi instan</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(100, 210)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="300" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#d97706" />
    <text x="32" y="23" font-family="monospace" font-size="12" font-weight="bold" fill="#92400e">MASTERCLASS COPYWRITING</text>

    <!-- Main Title -->
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#0f172a" letter-spacing="-1">
      Copywriting
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#brandAmber)" letter-spacing="-1">
      Konversi Tinggi
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Formula Kata-Kata Penjualan yang Mengubah
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#475569" font-weight="normal">
      Audiens Dingin Jadi Pembeli Loyal
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 285)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="67" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Grand Slam</text>

      <rect x="145" y="0" width="150" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="220" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Objection Killer</text>

      <rect x="305" y="0" width="140" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" />
      <text x="375" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Checkout CTA</text>
    </g>
  </g>
</svg>
