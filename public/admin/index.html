<body>

  <!-- Login Form Wrapper -->
  <div id="login-portal" class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-badge">⚡ Portal Penulis Blog</div>
        <h1 class="brand-title">SitusBisnis Admin</h1>
        <p class="brand-subtitle">Masuk dengan Username & PIN tim Anda untuk menulis dan mengelola postingan.</p>
      </div>

      <div id="error-box" class="alert-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username Tim</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="username"
              class="form-input"
              placeholder="timSiBi"
              value="timSiBi"
              required
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pin">PIN / Password Akses</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="pin"
              class="form-input"
              placeholder="Masukkan PIN rahasia..."
              required
              autocomplete="current-password"
            />

          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          <span>Masuk ke Dashboard</span>
        </button>
      </form>

      <div class="footer-note">
        Protected with AES-256 military-grade encryption.<br />
        Hubungi Administrator jika belum memiliki PIN akses.
      </div>
    </div>
  </div>

  <!-- Floating Logout Pill -->
  <div id="logout-bar" class="logout-bar">
    <button id="logout-btn" class="btn-logout" title="Keluar dari sesi ini">
      <span>🔒 Keluar (Logout)</span>
    </button>
  </div>

  <script>
    // Konfigurasi Terenkripsi (dihasilkan oleh: bun run setup-auth)
    const AUTH_CONFIG = {
    username: "timSiBi",
    salt: "eqGY0Ll8RnscikhrUk2JKg==",
    iv: "iYeswYAeDduuyp2S",
    data: "5kKKics6oQUVBQNDoI2Q55cv/sjMxLv3iSsSO7ffmY2WvSE96kCnRsswRJmZGT8Nc+/We7A9sp4=",
  };

    const loginPortal = document.getElementById('login-portal');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const pinInput = document.getElementById('pin');
    const submitBtn = document.getElementById('submit-btn');
    const errorBox = document.getElementById('error-box');
    const logoutBar = document.getElementById('logout-bar');
    const logoutBtn = document.getElementById('logout-btn');
    const togglePwd = document.getElementById('toggle-pwd');

    // Toggle lihat password
    togglePwd.addEventListener('click', () => {
      const isPwd = pinInput.type === 'password';
      pinInput.type = isPwd ? 'text' : 'password';
      togglePwd.textContent = isPwd ? 'Tutup' : 'Lihat';
    });

    // Dekripsi Token via Web Crypto PBKDF2 + AES-GCM
    async function decryptToken(encryptedPayload, secret) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(encryptedPayload.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(encryptedPayload.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(encryptedPayload.data), c => c.charCodeAt(0));

      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(secret),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const key = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt,
          iterations: 100000,
          hash: 'SHA-256',
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decrypted = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        data
      );

      return new TextDecoder().decode(decrypted);
    }

    // Inisialisasi CMS
    function bootCMS() {
      loginPortal.style.display = 'none';

      // Load Sveltia CMS script secara dinamis
      if (!document.getElementById('sveltia-script')) {
        const script = document.createElement('script');
        script.id = 'sveltia-script';
        script.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
        document.body.appendChild(script);
      }

      startSidebarObserver();
    }

    // Filter Kategori
    function applyCategoryFilter(catName) {
      document.querySelectorAll('.sibi-cat-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.category === catName);
      });

      const searchInput = document.querySelector('.search-bar input, input[type="search"]');
      if (searchInput) {
        const proto = Object.getPrototypeOf(searchInput);
        const nativeSet = Object.getOwnPropertyDescriptor(proto, 'value')?.set;
        if (nativeSet) {
          nativeSet.call(searchInput, catName);
        } else {
          searchInput.value = catName;
        }
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        searchInput.dispatchEvent(new Event('change', { bubbles: true }));
      }
    }

    // Injeksi Tree Kategori di bawah tombol Collections / Artikel Blog
    function injectCategoryTree(sidebar) {
      const listbox = sidebar.querySelector('[role="listbox"]');
      if (!listbox) return;
      if (sidebar.querySelector('#sibi-category-tree')) return;

      const tree = document.createElement('div');
      tree.id = 'sibi-category-tree';
      tree.className = 'sibi-category-tree';
      tree.innerHTML = `
        <div class="sibi-category-header">
          <span class="sibi-cat-label">KATEGORI ARTIKEL</span>
        </div>
        <div class="sibi-cat-list">
          <button type="button" class="sibi-cat-item active" data-category="">
            <span class="sibi-cat-icon">📑</span>
            <span class="sibi-cat-name">Semua Artikel</span>
            <span class="sibi-cat-badge">63</span>
          </button>
          <button type="button" class="sibi-cat-item" data-category="Strategi Bisnis">
            <span class="sibi-cat-icon">💼</span>
            <span class="sibi-cat-name">Strategi Bisnis</span>
            <span class="sibi-cat-badge">48</span>
          </button>
          <button type="button" class="sibi-cat-item" data-category="Monetisasi">
            <span class="sibi-cat-icon">💰</span>
            <span class="sibi-cat-name">Monetisasi</span>
            <span class="sibi-cat-badge">42</span>
          </button>
          <button type="button" class="sibi-cat-item" data-category="Funnel Penjualan">
            <span class="sibi-cat-icon">🎯</span>
            <span class="sibi-cat-name">Funnel Penjualan</span>
            <span class="sibi-cat-badge">20</span>
          </button>
          <button type="button" class="sibi-cat-item" data-category="Audience Growth">
            <span class="sibi-cat-icon">🚀</span>
            <span class="sibi-cat-name">Audience Growth</span>
            <span class="sibi-cat-badge">11</span>
          </button>
          <button type="button" class="sibi-cat-item" data-category="Email Marketing">
            <span class="sibi-cat-icon">✉️</span>
            <span class="sibi-cat-name">Email Marketing</span>
            <span class="sibi-cat-badge">5</span>
          </button>
        </div>
      `;

      listbox.after(tree);

      tree.querySelectorAll('.sibi-cat-item').forEach(btn => {
        btn.addEventListener('click', () => {
          applyCategoryFilter(btn.dataset.category);
        });
      });

      const mainBtn = listbox.querySelector('button');
      if (mainBtn && !mainBtn.dataset.sibiHooked) {
        mainBtn.dataset.sibiHooked = 'true';
        mainBtn.addEventListener('click', () => {
          applyCategoryFilter('');
        });
      }
    }

    // Injeksi Widget ke Sidebar agar bagian bawah tidak kosong
    function injectSidebarExtension() {
      const sidebar = document.querySelector('.primary-sidebar');
      if (!sidebar) return;

      injectCategoryTree(sidebar);

      if (sidebar.querySelector('#sibi-sidebar-extension')) return;

      const ext = document.createElement('div');
      ext.id = 'sibi-sidebar-extension';
      ext.className = 'sibi-sidebar-box';
      ext.innerHTML = `
        <div class="sibi-nav-group">
          <div class="sibi-group-title">Akses Cepat</div>
          <a href="https://blog.situsbisnis.com" target="_blank" rel="noopener noreferrer" class="sibi-quick-link">
            <span class="sibi-link-icon">🌐</span>
            <span class="sibi-link-text">Lihat Blog Live</span>
            <span class="sibi-link-badge">↗</span>
          </a>
          <a href="https://situsbisnis.com" target="_blank" rel="noopener noreferrer" class="sibi-quick-link">
            <span class="sibi-link-icon">⚡</span>
            <span class="sibi-link-text">Website Utama</span>
            <span class="sibi-link-badge">↗</span>
          </a>
          <a href="#/assets" class="sibi-quick-link">
            <span class="sibi-link-icon">🖼️</span>
            <span class="sibi-link-text">Pustaka Media</span>
          </a>
        </div>

        <div class="sibi-guide-card">
          <div class="sibi-guide-header">
            <span class="sibi-status-dot"></span>
            <span class="sibi-guide-title">SitusBisnis Publisher</span>
          </div>
          <div class="sibi-guide-stats">
            <span class="sibi-stat-pill">63 Artikel</span>
            <span class="sibi-stat-pill">Git: main</span>
          </div>
          <p class="sibi-guide-text">
            Setiap klik <strong>Save</strong>, sistem otomatis commit & menerbitkan artikel dalam 1–2 menit.
          </p>
        </div>

        <button type="button" id="sibi-sidebar-logout-btn" class="sibi-logout-action">
          <span>🔒</span>
          <span>Keluar (Logout)</span>
        </button>
      `;

      sidebar.appendChild(ext);

      const sidebarLogout = ext.querySelector('#sibi-sidebar-logout-btn');
      if (sidebarLogout) {
        sidebarLogout.addEventListener('click', () => {
          if (confirm('Apakah Anda yakin ingin keluar dari Portal Penulis?')) {
            localStorage.removeItem('sveltia-cms.user');
            localStorage.removeItem('decap-cms-user');
            location.reload();
          }
        });
      }
    }

    let observerStarted = false;
    function startSidebarObserver() {
      if (observerStarted) return;
      observerStarted = true;

      injectSidebarExtension();
      setInterval(injectSidebarExtension, 600);

      const observer = new MutationObserver(() => {
        injectSidebarExtension();
      });
      observer.observe(document.body, { childList: true, subtree: true });
    }

    // Periksa apakah sudah ada sesi aktif di localStorage
    function checkExistingSession() {
      try {
        const stored = localStorage.getItem('sveltia-cms.user');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && parsed.token) {
            bootCMS();
            return true;
          }
        }
      } catch (e) {
        // Abaikan jika corrupt
      }
      return false;
    }

    // Logout fallback
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        if (confirm('Apakah Anda yakin ingin keluar dari Portal Penulis?')) {
          localStorage.removeItem('sveltia-cms.user');
          localStorage.removeItem('decap-cms-user');
          location.reload();
        }
      });
    }

    // Handle Submit Form Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      errorBox.textContent = '';

      const inputUser = usernameInput.value.trim();
      const inputPin = pinInput.value.trim();

      if (!inputUser || !inputPin) {
        errorBox.textContent = 'Silakan isi Username dan PIN.';
        errorBox.style.display = 'block';
        return;
      }

      if (!AUTH_CONFIG.data) {
        errorBox.textContent = '⚠️ Admin belum melakukan setup PIN & Token. Silakan hubungi Administrator.';
        errorBox.style.display = 'block';
        return;
      }

      // Validasi Username
      if (inputUser.toLowerCase() !== AUTH_CONFIG.username.toLowerCase()) {
        errorBox.textContent = '❌ Username atau PIN salah.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<div class="spinner"></div><span>Memverifikasi...</span>';

      try {
        // Coba dekripsi token dengan PIN
        const secret = `${AUTH_CONFIG.username}:${inputPin}`;
        const token = await decryptToken(AUTH_CONFIG, secret);

        if (!token) {
          throw new Error('Token kosong');
        }

        // Siapkan objek user untuk Sveltia CMS
        let userProfile = {
          backendName: 'github',
          id: 1,
          name: 'Tim SitusBisnis',
          login: 'tim-situsbisnis',
          email: 'admin@situsbisnis.com',
          avatarURL: 'https://blog.situsbisnis.com/favicon.png',
          profileURL: 'https://github.com/crediblemark-official/Blog-SiBi',
          token: token,
          bot: false,
        };

        // Coba ambil data asli dari GitHub jika memungkinkan
        try {
          const ghRes = await fetch('https://api.github.com/user', {
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: 'application/vnd.github+json',
            },
          });
          if (ghRes.ok) {
            const ghData = await ghRes.json();
            userProfile.id = ghData.id;
            userProfile.name = ghData.name || ghData.login || userProfile.name;
            userProfile.login = ghData.login;
            userProfile.avatarURL = ghData.avatar_url || userProfile.avatarURL;
            userProfile.profileURL = ghData.html_url || userProfile.profileURL;
          }
        } catch (_) {
          // Tetap lanjutkan dengan fallback userProfile
        }

        // Simpan ke localStorage agar CMS mengenali pengguna
        localStorage.setItem('sveltia-cms.user', JSON.stringify(userProfile));
        localStorage.setItem('decap-cms-user', JSON.stringify({ backendName: 'github', token: token }));

        // Buka CMS
        bootCMS();
      } catch (err) {
        errorBox.textContent = '❌ Username atau PIN salah. Silakan periksa kembali.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Masuk ke Dashboard</span>';
      }
    });

    // Jalankan pengecekan sesi saat halaman dibuka
    checkExistingSession();
  </script>
</body>
</html>
