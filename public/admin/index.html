<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portal Admin | Blog SitusBisnis</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Marked Library for Instant Client-Side Preview -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --surface: #0f172a;
      --surface-hover: #17223b;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #f59e0b;
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --primary-active: #b45309;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
    html, body { background-color: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

    /* Utilities */
    .hidden { display: none !important; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-1 { gap: 0.25rem; }
    .gap-2 { gap: 0.5rem; }
    .gap-3 { gap: 0.75rem; }
    .w-full { width: 100%; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Scrollbars */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Buttons & Touch Targets (Min 44px Tap on Mobile) */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      font-size: 0.8125rem;
      font-weight: 600;
      border-radius: 0.5rem;
      padding: 0 0.875rem;
      min-height: 2.5rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      text-decoration: none;
      color: inherit;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      font-weight: 700;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #1e293b;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: #334155; }
    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.05); color: #fff; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

    .btn-icon-only {
      width: 2.5rem;
      min-width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border-radius: 0.5rem;
    }

    /* Form Controls */
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.375rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .input-box {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.625rem 0.875rem;
      color: var(--text);
      font-size: 0.875rem;
      min-height: 2.625rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-box:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.15);
    }
    select.input-box { cursor: pointer; }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
    }
    .badge-id { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-en { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-cat { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.25); }
    .badge-pair {
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.25);
      cursor: pointer;
    }
    .badge-pair:hover { text-decoration: underline; }

    /* Sticky App Bar (h-14 / 56px) */
    .app-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      height: 3.5rem;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 0.9375rem;
      color: #fff;
      text-decoration: none;
    }
    .app-brand span { color: var(--primary); }

    /* Horizontal KPI Rail (Full-Edge on Mobile) */
    .kpi-rail {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border);
    }
    .kpi-item {
      flex: 1;
      min-width: 140px;
      scroll-snap-align: start;
      padding: 0.75rem 1rem;
      border-right: 1px solid var(--border);
    }
    @media (min-width: 768px) {
      .kpi-rail { display: grid; grid-template-columns: repeat(4, 1fr); }
      .kpi-item { min-width: auto; padding: 1rem 1.25rem; }
    }
    .kpi-label { font-size: 0.6875rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi-val { font-size: 1.35rem; font-weight: 800; color: #fff; font-family: var(--font-mono); margin-top: 0.15rem; }

    /* Filter & Search Bar */
    .filter-bar {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-dim);
    }
    .search-wrap input {
      padding-left: 2.25rem;
      height: 2.375rem;
      min-height: 2.375rem;
      font-size: 0.8125rem;
    }
    .seg-pill {
      display: flex;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 2px;
      gap: 2px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .seg-btn.active {
      background: var(--primary);
      color: #090d16;
      font-weight: 700;
    }

    /* Article List Table / Mobile Rows */
    .list-wrapper {
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .article-item {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: background-color 0.15s;
    }
    .article-item:hover { background: rgba(255, 255, 255, 0.02); }
    .item-main { min-width: 0; flex: 1; }
    .item-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      display: block;
      margin-bottom: 0.25rem;
      text-decoration: none;
    }
    .item-title:hover { color: var(--primary); }
    .item-sub {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      flex-wrap: wrap;
    }
    .item-actions {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      flex-shrink: 0;
    }

    /* Editor Layout (Mobile First Segmented vs Desktop 2-Col) */
    .editor-container {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 3.5rem);
    }
    .editor-tabs-mobile {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: #0f172a;
    }
    @media (min-width: 1024px) {
      .editor-tabs-mobile { display: none; }
    }
    .editor-tab-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-align: center;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .editor-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(245, 158, 11, 0.05);
    }

    .editor-body-grid {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    @media (min-width: 1024px) {
      .editor-body-grid {
        display: grid;
        grid-template-columns: 320px 1fr;
        height: calc(100vh - 3.5rem);
      }
    }

    .meta-sidebar {
      padding: 1rem;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
      overflow-y: auto;
    }
    .editor-pane-wrap {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    /* Editor Toolbar */
    .editor-toolbar {
      background: #0b0f19;
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      overflow-x: auto;
    }
    .tbar-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.25rem 0.55rem;
      border-radius: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tbar-btn:hover { background: #334155; color: #fff; }

    /* Dual Pane Split */
    .editor-split {
      display: flex;
      flex: 1;
      min-height: 400px;
      height: 100%;
    }
    .code-editor {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #090d16;
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.6;
      padding: 1rem;
      border: none;
      resize: none;
      outline: none;
    }
    .preview-box {
      flex: 1;
      background: #0f172a;
      border-left: 1px solid var(--border);
      padding: 1.25rem;
      overflow-y: auto;
      color: #cbd5e1;
      font-size: 0.9375rem;
      line-height: 1.7;
    }
    .preview-box h1 { font-size: 1.5rem; color: #fff; margin-bottom: 0.75rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--border); }
    .preview-box h2 { font-size: 1.25rem; color: #fff; margin: 1.25rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border); }
    .preview-box h3 { font-size: 1.05rem; color: var(--primary); margin: 1rem 0 0.5rem; }
    .preview-box p { margin-bottom: 0.875rem; }
    .preview-box ul, .preview-box ol { margin: 0 0 0.875rem 1.25rem; }
    .preview-box blockquote { border-left: 3px solid var(--primary); padding-left: 0.875rem; color: var(--text-muted); font-style: italic; margin-bottom: 0.875rem; }
    .preview-box code { font-family: var(--font-mono); background: #090d16; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; color: var(--primary); }
    .preview-box pre code { display: block; padding: 0.75rem; overflow-x: auto; color: #e2e8f0; border-radius: 0.375rem; }
    .preview-box img { max-width: 100%; border-radius: 0.375rem; margin: 0.75rem 0; }

    /* Mobile Visibility Controls */
    @media (max-width: 1023px) {
      .panel-mobile-hidden { display: none !important; }
    }

    /* Toast Container */
    .toast-box {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      left: 1rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      pointer-events: none;
    }
    @media (min-width: 640px) {
      .toast-box { left: auto; max-width: 380px; }
    }
    .toast {
      pointer-events: auto;
      background: #1e293b;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.8125rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .toast.success { border-color: rgba(16, 185, 129, 0.4); }
    .toast.error { border-color: rgba(239, 68, 68, 0.4); }

    /* Spinner */
    .spin {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. LOGIN PORTAL (Compact & Mobile First)   -->
  <!-- ========================================== -->
  <div id="login-portal" class="flex items-center justify-center" style="min-height: 100vh; padding: 1rem;">
    <div style="width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1.75rem 1.25rem;">
      <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.25rem;">
        <svg style="width: 26px; height: 26px; color: var(--primary);" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <span style="font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em;">situsbisnis<span style="color: var(--primary);">.com</span></span>
        <span class="badge badge-cat" style="margin-left: auto;">Admin</span>
      </div>

      <div id="login-error" class="hidden" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.8rem; margin-bottom: 1rem;"></div>

      <form id="login-form">
        <div style="margin-bottom: 1rem;">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="input-box" placeholder="timSiBi" autocomplete="username" required />
        </div>
        <div style="margin-bottom: 1.25rem;">
          <label class="form-label" for="pin">PIN Akses</label>
          <input type="password" id="pin" class="input-box" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary w-full">
          <span>Masuk</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. DASHBOARD VIEW (Full-Edge Mobile First) -->
  <!-- ========================================== -->
  <div id="dashboard-view" class="hidden">
    <!-- App Bar -->
    <header class="app-bar">
      <a href="#" class="app-brand" onclick="app.showDashboard(); return false;">
        <svg style="width: 20px; height: 20px; color: var(--primary);" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
        </svg>
        <span>Blog Admin</span>
      </a>

      <div class="flex items-center gap-2">
        <button class="btn btn-primary" onclick="app.createNewArticle()">
          <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
          <span>Tulis</span>
        </button>
        <a href="https://blog.situsbisnis.com" target="_blank" class="btn btn-secondary btn-icon-only" title="Lihat Blog Publik">
          <svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </a>
        <button class="btn btn-ghost btn-icon-only" onclick="app.logout()" title="Keluar">
          <svg style="width: 15px; height: 15px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </header>

    <!-- Horizontal KPI Rail -->
    <section class="kpi-rail no-scrollbar">
      <div class="kpi-item">
        <div class="kpi-label">Artikel ID</div>
        <div class="kpi-val" id="stat-count-id">0</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-label">Artikel EN</div>
        <div class="kpi-val" id="stat-count-en">0</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-label">Kategori</div>
        <div class="kpi-val">5</div>
      </div>
      <div class="kpi-item">
        <div class="kpi-label">GitHub Sync</div>
        <div class="kpi-val" style="color: var(--success); font-size: 0.95rem; display: flex; align-items: center; gap: 0.35rem; margin-top: 0.35rem;">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block;"></span>
          <span>Online</span>
        </div>
      </div>
    </section>

    <!-- Filter & Search Strip -->
    <section class="filter-bar">
      <div class="search-wrap">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="search-input" class="input-box" placeholder="Cari judul atau slug..." oninput="app.handleSearch(this.value)" />
      </div>

      <div class="seg-pill">
        <button class="seg-btn active" data-lang="all" onclick="app.setLangFilter('all')">Semua</button>
        <button class="seg-btn" data-lang="id" onclick="app.setLangFilter('id')">ID</button>
        <button class="seg-btn" data-lang="en" onclick="app.setLangFilter('en')">EN</button>
      </div>

      <select id="category-filter" class="input-box" style="width: auto; min-width: 140px; height: 2.375rem; min-height: 2.375rem; padding: 0 0.5rem; font-size: 0.8125rem;" onchange="app.setCategoryFilter(this.value)">
        <option value="all">Semua Kategori</option>
        <option value="strategi-bisnis">Strategi Bisnis</option>
        <option value="monetisasi">Monetisasi</option>
        <option value="funnel-penjualan">Funnel Penjualan</option>
        <option value="audience-growth">Audience Growth</option>
        <option value="email-marketing">Email Marketing</option>
      </select>
    </section>

    <!-- Compact Article List -->
    <main class="list-wrapper" id="article-list-container">
      <div style="text-align: center; padding: 3rem; color: var(--text-dim);">
        <div class="spin" style="margin: 0 auto 0.5rem auto;"></div>
        Memuat artikel...
      </div>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- 3. EDITOR VIEW (Mobile-First Segmented)    -->
  <!-- ========================================== -->
  <div id="editor-view" class="editor-container hidden">
    <!-- Editor Header -->
    <header class="app-bar">
      <div class="flex items-center gap-2 min-w-0">
        <button class="btn btn-ghost btn-icon-only" onclick="app.showDashboard()" title="Kembali">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </button>
        <div id="editor-title-badge" class="truncate" style="font-weight: 700; font-size: 0.875rem;">Tulis Artikel</div>
      </div>

      <div class="flex items-center gap-2">
        <button id="save-btn" class="btn btn-primary" onclick="app.saveArticle()">
          <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
          <span>Simpan</span>
        </button>

    // Native Web Crypto Decryption
    async function decryptToken(config, secret) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(config.salt), c => c.charCodeAt(0));
      const iv = Uint8Array.from(atob(config.iv), c => c.charCodeAt(0));
      const data = Uint8Array.from(atob(config.data), c => c.charCodeAt(0));

      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(secret), { name: 'PBKDF2' }, false, ['deriveKey']
      );

      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );

      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return new TextDecoder().decode(decrypted);
    }

    function decodeBase64Utf8(base64Str) {
      const clean = (base64Str || '').replace(/\s/g, '');
      const binary = atob(clean);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }

    function encodeBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    class BlogAdminApp {
      constructor() {
        this.token = null;
        this.articles = [];
        this.activeLangFilter = 'all';
        this.activeCategoryFilter = 'all';
        this.searchQuery = '';
        this.currentArticle = null;
        this.editorLang = 'id';
        this.existingSha = null;
        this.currentMobileTab = 'content';
      }

      init() {
        this.checkSession();
        this.bindEvents();
      }

      showToast(msg, type = 'info') {
        const box = document.getElementById('toast-box');
        const t = document.createElement('div');
        t.className = `toast ${type}`;
        t.innerHTML = `<span>${msg}</span>`;
        box.appendChild(t);
        setTimeout(() => {
          t.style.opacity = '0';
          t.style.transform = 'translateY(8px)';
          setTimeout(() => t.remove(), 200);
        }, 3500);
      }

      async checkSession() {
        try {
          const stored = sessionStorage.getItem('blog_sibi_token') || localStorage.getItem('blog_sibi_token');
          if (stored) {
            this.token = stored;
            this.onAuthenticated();
          }
        } catch (_) {}
      }

      bindEvents() {
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const u = document.getElementById('username').value.trim();
          const p = document.getElementById('pin').value.trim();
          const err = document.getElementById('login-error');
          const btn = document.getElementById('login-btn');

          err.classList.add('hidden');

          if (u.toLowerCase() !== AUTH_CONFIG.username.toLowerCase()) {
            err.textContent = 'Username atau PIN salah.';
            err.classList.remove('hidden');
            return;
          }

          btn.disabled = true;
          btn.innerHTML = '<div class="spin"></div><span>Verifikasi...</span>';

          try {
            const token = await decryptToken(AUTH_CONFIG, `${u}:${p}`);
            if (!token) throw new Error('Token kosong');
            this.token = token;
            sessionStorage.setItem('blog_sibi_token', token);
            localStorage.setItem('blog_sibi_token', token);
            this.onAuthenticated();
          } catch (e) {
            err.textContent = 'Username atau PIN salah.';
            err.classList.remove('hidden');
            btn.disabled = false;
            btn.innerHTML = '<span>Masuk</span>';
          }
        });
      }

      async onAuthenticated() {
        document.getElementById('login-portal').classList.add('hidden');
        document.getElementById('dashboard-view').classList.remove('hidden');
        document.getElementById('editor-view').classList.add('hidden');
        await this.loadArticles();
      }

      logout() {
        sessionStorage.removeItem('blog_sibi_token');
        localStorage.removeItem('blog_sibi_token');
        this.token = null;
        window.location.reload();
      }

      async loadArticles() {
        try {
          let res = await fetch('/admin/articles.json');
          if (res.ok) {
            this.articles = await res.json();
          } else {
            await this.loadArticlesFromGitHub();
          }
        } catch (_) {
          await this.loadArticlesFromGitHub();
        }

        this.updateStats();
        this.renderArticles();
      }

      async loadArticlesFromGitHub() {
        try {
          const res = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/main?recursive=1`, {
            headers: { Authorization: `Bearer ${this.token}`, Accept: 'application/vnd.github+json' },
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const mdFiles = (data.tree || []).filter(item => item.path.startsWith('src/content/blog/') && item.path.endsWith('.md'));

          this.articles = mdFiles.map(file => {
            const isEn = file.path.startsWith('src/content/blog/en/');
            const relPath = file.path.replace('src/content/blog/', '');
            const slug = isEn ? relPath.replace(/^en\//, '').replace(/\.md$/, '') : relPath.replace(/\.md$/, '');
            return {
              id: relPath,
              slug: slug,
              lang: isEn ? 'en' : 'id',
              title: slug.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
              date: new Date().toISOString(),
              categories: [isEn ? 'Business Strategy' : 'Strategi Bisnis'],
              filePath: file.path,
              sha: file.sha,
            };
          });
        } catch (err) {
          this.showToast('Gagal memuat artikel: ' + err.message, 'error');
        }
      }

      updateStats() {
        const idCount = this.articles.filter(a => a.lang === 'id').length;
        const enCount = this.articles.filter(a => a.lang === 'en').length;
        document.getElementById('stat-count-id').textContent = idCount;
        document.getElementById('stat-count-en').textContent = enCount;
      }

      handleSearch(q) {
        this.searchQuery = q.toLowerCase().trim();
        this.renderArticles();
      }

      setLangFilter(lang) {
        this.activeLangFilter = lang;
        document.querySelectorAll('.seg-btn[data-lang]').forEach(b => {
          b.classList.toggle('active', b.getAttribute('data-lang') === lang);
        });
        this.renderArticles();
      }

      setCategoryFilter(c) {
        this.activeCategoryFilter = c;
        this.renderArticles();
      }

      renderArticles() {
        const container = document.getElementById('article-list-container');
        
        let filtered = this.articles.filter(item => {
          if (this.activeLangFilter !== 'all' && item.lang !== this.activeLangFilter) return false;
          if (this.searchQuery) {
            const t = (item.title || '').toLowerCase();
            const s = (item.slug || '').toLowerCase();
            if (!t.includes(this.searchQuery) && !s.includes(this.searchQuery)) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div style="text-align: center; padding: 3rem; color: var(--text-dim);">Tidak ada artikel yang cocok.</div>`;
          return;
        }

        container.innerHTML = filtered.map(item => {
          const isEn = item.lang === 'en';
          const liveUrl = isEn ? `https://blog.situsbisnis.com/en/posts/${item.slug}/` : `https://blog.situsbisnis.com/posts/${item.slug}/`;
          const langBadge = isEn 
            ? `<span class="badge badge-en">EN</span>` 
            : `<span class="badge badge-id">ID</span>`;
          
          const cat = (item.categories || [])[0] || '';
          const catBadge = cat ? `<span class="badge badge-cat">${cat}</span>` : '';
          
          let pairHtml = '';
          if (isEn && item.translationOf) {
            const idTarget = item.translationOf.replace(/\.md$/, '');
            pairHtml = `<span class="badge badge-pair" title="Buka artikel sumber ID" onclick="app.editArticle('${item.translationOf}')">ID: ${idTarget}</span>`;
          } else if (!isEn) {
            const enPair = this.articles.find(a => a.lang === 'en' && (a.translationOf === item.id || a.translationOf === `${item.slug}.md`));
            if (enPair) {
              pairHtml = `<span class="badge badge-pair" onclick="app.editArticle('${enPair.id}')">EN: ${enPair.slug}</span>`;
            } else {
              pairHtml = `<button class="badge btn-ghost" style="border: 1px dashed var(--border);" onclick="app.createEnTranslation('${item.id}', '${item.slug}')">+ EN</button>`;
            }
          }

          const dateStr = item.date ? new Date(item.date).toLocaleDateString('id-ID', { year: '2-digit', month: 'short', day: 'numeric' }) : '';

          return `
            <div class="article-item">
              <div class="item-main">
                <a href="javascript:void(0)" class="item-title truncate" onclick="app.editArticle('${item.id}')">${item.title}</a>
                <div class="item-sub">
                  ${langBadge}
                  ${catBadge}
                  <span>${dateStr}</span>
                  ${pairHtml}
                </div>
              </div>
              <div class="item-actions">
                <button class="btn btn-secondary btn-icon-only" onclick="app.editArticle('${item.id}')" title="Edit">
                  <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                </button>
                <a href="${liveUrl}" target="_blank" class="btn btn-ghost btn-icon-only" title="Lihat">
                  <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                </a>
                <button class="btn btn-ghost btn-danger btn-icon-only" onclick="app.deleteArticle('${item.id}')" title="Hapus">
                  <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      showDashboard() {
        document.getElementById('dashboard-view').classList.remove('hidden');
        document.getElementById('editor-view').classList.add('hidden');
      }

      showEditor() {
        document.getElementById('dashboard-view').classList.add('hidden');
        document.getElementById('editor-view').classList.remove('hidden');
        this.switchMobileTab('content');
      }

      switchMobileTab(tab) {
        this.currentMobileTab = tab;
        document.getElementById('tab-btn-content').classList.toggle('active', tab === 'content');
        document.getElementById('tab-btn-meta').classList.toggle('active', tab === 'meta');
        document.getElementById('tab-btn-preview').classList.toggle('active', tab === 'preview');

        const pMeta = document.getElementById('panel-meta');
        const pContent = document.getElementById('panel-content');
        const pPreview = document.getElementById('panel-preview');
        const pWrap = document.getElementById('panel-editor-wrap');

        // Reset desktop default classes
        pMeta.classList.remove('panel-mobile-hidden');
        pPreview.classList.remove('panel-mobile-hidden');
        pContent.classList.remove('hidden');
        pWrap.classList.remove('hidden');

        if (window.innerWidth < 1024) {
          if (tab === 'content') {
            pMeta.classList.add('panel-mobile-hidden');
            pPreview.classList.add('panel-mobile-hidden');
          } else if (tab === 'meta') {
            pWrap.classList.add('hidden');
          } else if (tab === 'preview') {
            pMeta.classList.add('panel-mobile-hidden');
            pContent.classList.add('hidden');
          }
        }
      }

      setEditorLanguage(lang) {
        this.editorLang = lang;
        document.getElementById('btn-lang-id').classList.toggle('active', lang === 'id');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
        
        const catSelect = document.getElementById('edit-category');
        catSelect.innerHTML = CATEGORIES[lang].map(c => `<option value="${c.label}">${c.label}</option>`).join('');

        const transGroup = document.getElementById('group-translation');
        if (lang === 'en') {
          transGroup.classList.remove('hidden');
          this.populateTranslationOptions();
        } else {
          transGroup.classList.add('hidden');
        }
      }

      populateTranslationOptions(selectedVal = '') {
        const select = document.getElementById('edit-translation');
        const idArticles = this.articles.filter(a => a.lang === 'id');
        select.innerHTML = '<option value="">-- Tanpa Relasi --</option>' + 
          idArticles.map(a => `<option value="${a.slug}.md" ${selectedVal === `${a.slug}.md` ? 'selected' : ''}>${a.title} (${a.slug})</option>`).join('');
      }

      handleTitleInput(val) {
        const slugInput = document.getElementById('edit-slug');
        if (!this.currentArticle) {
          slugInput.value = val.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        }
      }

      handleContentInput(val) {
        const words = val.trim() ? val.trim().split(/\s+/).length : 0;
        document.getElementById('word-count').textContent = `${words} kata`;

        const preview = document.getElementById('panel-preview');
        if (window.marked) {
          preview.innerHTML = marked.parse(val);
        }
      }

      insertMarkdown(before, after) {
        const textarea = document.getElementById('markdown-body');
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const text = textarea.value;
        const selected = text.substring(start, end);
        const rep = before + selected + after;
        textarea.value = text.substring(0, start) + rep + text.substring(end);
        textarea.focus();
        textarea.selectionStart = start + before.length;
        textarea.selectionEnd = end + before.length;
        this.handleContentInput(textarea.value);
      }

      createNewArticle() {
        this.currentArticle = null;
        this.existingSha = null;
        this.editorLang = 'id';
        
        document.getElementById('editor-title-badge').textContent = 'Tulis Baru';
        document.getElementById('edit-title').value = '';
        document.getElementById('edit-slug').value = '';
        document.getElementById('edit-desc').value = '';
        document.getElementById('edit-author').value = 'Tim Editorial SitusBisnis';
        document.getElementById('edit-date').value = new Date().toISOString().slice(0, 16);
        document.getElementById('edit-tags').value = '';
        document.getElementById('edit-image').value = '/images/posts/creator-commerce-cover.svg';
        document.getElementById('markdown-body').value = '# Judul Bagian\n\nTulis isi artikel di sini...';

        this.setEditorLanguage('id');
        this.handleContentInput(document.getElementById('markdown-body').value);
        this.showEditor();
      }

      createEnTranslation(sourceId, sourceSlug) {
        this.createNewArticle();
        this.setEditorLanguage('en');
        document.getElementById('editor-title-badge').textContent = `EN: ${sourceSlug}`;
        document.getElementById('edit-slug').value = sourceSlug;
        document.getElementById('edit-author').value = 'SitusBisnis Editorial Team';
        this.populateTranslationOptions(`${sourceSlug}.md`);
        document.getElementById('edit-translation').value = `${sourceSlug}.md`;
      }

      async editArticle(id) {
        this.showToast('Memuat artikel dari GitHub...', 'info');
        const cleanId = id.endsWith('.md') ? id : `${id}.md`;
        const targetPath = `src/content/blog/${cleanId}`;

        try {
          const res = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
            headers: { Authorization: `Bearer ${this.token}`, Accept: 'application/vnd.github+json' },
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const fileData = await res.json();
          this.existingSha = fileData.sha;
          this.currentArticle = cleanId;

          const decodedContent = decodeBase64Utf8(fileData.content);
          
          const fmMatch = decodedContent.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
          let fm = {};
          let body = decodedContent;

          if (fmMatch) {
            fmMatch[1].split('\n').forEach(line => {
              const colonIdx = line.indexOf(':');
              if (colonIdx > -1) {
                const key = line.slice(0, colonIdx).trim();
                let val = line.slice(colonIdx + 1).trim();
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                  val = val.slice(1, -1);
                }
                fm[key] = val;
              }
            });
            body = fmMatch[2];
          }

          const isEn = cleanId.startsWith('en/');
          this.setEditorLanguage(isEn ? 'en' : 'id');

          const cleanSlug = cleanId.replace(/^en\//, '').replace(/\.md$/, '');
          document.getElementById('editor-title-badge').textContent = cleanSlug;
          document.getElementById('edit-title').value = fm.title || '';
          document.getElementById('edit-slug').value = cleanSlug;
          document.getElementById('edit-desc').value = fm.description || '';
          document.getElementById('edit-author').value = fm.author || (isEn ? 'SitusBisnis Editorial Team' : 'Tim Editorial SitusBisnis');
          
          if (fm.date) {
            try {
              document.getElementById('edit-date').value = new Date(fm.date).toISOString().slice(0, 16);
            } catch (_) {}
          }

          if (fm.categories) {
            let cat = fm.categories.replace(/[\[\]"]/g, '').split(',')[0].trim();
            document.getElementById('edit-category').value = cat;
          }

          if (fm.tags) {
            document.getElementById('edit-tags').value = fm.tags.replace(/[\[\]"]/g, '');
          }

          document.getElementById('edit-image').value = fm.image || '/images/posts/creator-commerce-cover.svg';

          if (isEn && fm.translationOf) {
            this.populateTranslationOptions(fm.translationOf);
            document.getElementById('edit-translation').value = fm.translationOf;
          }

          document.getElementById('markdown-body').value = body;
          this.handleContentInput(body);

          this.showEditor();
        } catch (err) {
          this.showToast('Gagal memuat artikel: ' + err.message, 'error');
        }
      }

      async handleImageUpload(file) {
        if (!file) return;
        const saveName = `${Date.now()}-${file.name.toLowerCase().replace(/[^a-z0-9.]+/g, '-')}`;
        const targetPath = `public/images/posts/${saveName}`;

        this.showToast('Mengupload cover ke GitHub...', 'info');

        try {
          const reader = new FileReader();
          reader.onload = async () => {
            const base64Content = reader.result.split(',')[1];
            const res = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
              method: 'PUT',
              headers: { Authorization: `Bearer ${this.token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: `media(blog): upload cover image ${saveName}`,
                content: base64Content,
                branch: 'main',
              }),
            });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            document.getElementById('edit-image').value = `/images/posts/${saveName}`;
            this.showToast('Cover berhasil diunggah.', 'success');
          };
          reader.readAsDataURL(file);
        } catch (err) {
          this.showToast('Gagal upload: ' + err.message, 'error');
        }
      }

      async saveArticle() {
        const title = document.getElementById('edit-title').value.trim();
        let slug = document.getElementById('edit-slug').value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        const desc = document.getElementById('edit-desc').value.trim();
        const category = document.getElementById('edit-category').value;
        const author = document.getElementById('edit-author').value.trim();
        const dateVal = document.getElementById('edit-date').value;
        const tagsVal = document.getElementById('edit-tags').value.trim();
        const image = document.getElementById('edit-image').value.trim() || '/images/posts/creator-commerce-cover.svg';
        const translationOf = document.getElementById('edit-translation').value;
        const body = document.getElementById('markdown-body').value;

        if (!title || !slug) {
          this.showToast('Judul dan Slug wajib diisi.', 'error');
          return;
        }

        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<div class="spin"></div><span>Menyimpan...</span>';

        const isEn = this.editorLang === 'en';
        const cleanSlug = slug.replace(/^en\//, '').replace(/\.md$/, '');
        const targetFilename = `${cleanSlug}.md`;
        const targetPath = isEn ? `src/content/blog/en/${targetFilename}` : `src/content/blog/${targetFilename}`;

        const tagsArr = tagsVal ? tagsVal.split(',').map(t => `"${t.trim()}"`).join(', ') : '';
        let fmLines = [
          '---',
          `title: "${title.replace(/"/g, '\\"')}"`,
          `description: "${desc.replace(/"/g, '\\"')}"`,
          `date: ${new Date(dateVal || Date.now()).toISOString()}`,
          `categories: ["${category}"]`,
          tagsArr ? `tags: [${tagsArr}]` : 'tags: []',
          `author: "${author.replace(/"/g, '\\"')}"`,
          `image: "${image}"`,
          `lang: "${this.editorLang}"`,
        ];

        if (isEn && translationOf) {
          fmLines.push(`translationOf: "${translationOf}"`);
        }

        fmLines.push('---');
        fmLines.push('');
        fmLines.push(body);

        const fullContent = fmLines.join('\n');
        const base64Content = encodeBase64Utf8(fullContent);

        try {
          let sha = this.existingSha;
          if (!sha) {
            try {
              const checkRes = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
                headers: { Authorization: `Bearer ${this.token}`, Accept: 'application/vnd.github+json' },
              });
              if (checkRes.ok) {
                const checkData = await checkRes.json();
                sha = checkData.sha;
              }
            } catch (_) {}
          }

          const payload = {
            message: `content(blog): ${sha ? 'update' : 'publish'} ${title}`,
            content: base64Content,
            branch: 'main',
          };
          if (sha) payload.sha = sha;

          const res = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${this.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.message || `HTTP ${res.status}`);
          }

          this.showToast('Artikel berhasil disimpan ke GitHub.', 'success');
          await this.loadArticles();
          setTimeout(() => this.showDashboard(), 800);
        } catch (err) {
          this.showToast('Gagal menyimpan: ' + err.message, 'error');
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg><span>Simpan</span>';
        }
      }

      async deleteArticle(id) {
        const cleanId = id.endsWith('.md') ? id : `${id}.md`;
        if (!confirm(`Hapus artikel ${cleanId} dari GitHub?`)) return;

        const targetPath = `src/content/blog/${cleanId}`;
        this.showToast('Menghapus artikel...', 'info');

        try {
          const checkRes = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
            headers: { Authorization: `Bearer ${this.token}`, Accept: 'application/vnd.github+json' },
          });
          if (!checkRes.ok) throw new Error(`File tidak ditemukan (${checkRes.status})`);
          const checkData = await checkRes.json();

          const delRes = await fetch(`${GITHUB_API}/repos/${REPO_OWNER}/${REPO_NAME}/contents/${targetPath}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${this.token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: `content(blog): delete article ${cleanId}`,
              sha: checkData.sha,
              branch: 'main',
            }),
          });

          if (!delRes.ok) throw new Error(`HTTP ${delRes.status}`);

          this.showToast('Artikel berhasil dihapus.', 'success');
          this.articles = this.articles.filter(a => a.id !== id);
          this.updateStats();
          this.renderArticles();
        } catch (err) {
          this.showToast('Gagal menghapus: ' + err.message, 'error');
        }
      }
    }

    const app = new BlogAdminApp();
    window.app = app;
    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
