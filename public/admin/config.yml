backend:
  name: github
  repo: crediblemark-official/Blog-SiBi
  branch: main

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  - name: "blog"
    label: "Artikel Blog"
    label_singular: "Artikel"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    view_filters:
      - label: "Semua Kategori"
        field: "categories"
        pattern: ".*"
      - label: "Strategi Bisnis"
        field: "categories"
        pattern: "Strategi Bisnis"
      - label: "Monetisasi"
        field: "categories"
        pattern: "Monetisasi"
      - label: "Funnel Penjualan"
        field: "categories"
        pattern: "Funnel Penjualan"
      - label: "Audience Growth"
        field: "categories"
        pattern: "Audience Growth"
      - label: "Email Marketing"
        field: "categories"
        pattern: "Email Marketing"
    view_groups:
      - label: "Kategori"
        field: "categories"
    fields:
      - label: "Judul Artikel"
        name: "title"
        widget: "string"
        hint: "Judul utama artikel (menarik & jelas untuk SEO)"
      - label: "Deskripsi Singkat (SEO)"
        name: "description"
        widget: "text"
        hint: "Ringkasan 1-2 kalimat untuk meta description Google dan preview kartu blog"
      - label: "Tanggal & Jam Publikasi"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        picker_utc: false
        hint: "Waktu penayangan artikel (menentukan urutan postingan di homepage)"
      - label: "Kategori"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "Strategi Bisnis"
          - "Monetisasi"
          - "Funnel Penjualan"
          - "Audience Growth"
          - "Email Marketing"
      - label: "Tags / Kata Kunci"
        name: "tags"
        widget: "list"
        default: ["SitusBisnis"]
        hint: "Daftar kata kunci atau topik terkait artikel"
      - label: "Penulis"
        name: "author"
        widget: "string"
        default: "Tim SitusBisnis"
      - label: "Gambar Sampul (Cover)"
        name: "image"
        widget: "image"
        required: false
        hint: "Pilih file gambar atau SVG (otomatis diunggah ke folder /images/posts/)"
      - label: "Seri Artikel (Opsional)"
        name: "series"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "ID Seri (slug unik)"
            name: "id"
            widget: "string"
            required: false
          - label: "Nama Seri Lengkap"
            name: "name"
            widget: "string"
            required: false
          - label: "Bagian Ke (Part)"
            name: "part"
            widget: "number"
            value_type: "int"
            required: false
          - label: "Total Bagian"
            name: "totalParts"
            widget: "number"
            value_type: "int"
            required: false
      - label: "Isi Konten Artikel"
        name: "body"
        widget: "markdown"
        hint: "Tulis artikel menggunakan editor visual (bisa buat heading, bold, quote, list, dll.)"
