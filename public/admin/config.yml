backend:
  name: github
  repo: crediblemark-official/Blog-SiBi
  branch: main

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  # 🇮🇩 1. Koleksi Artikel Bahasa Indonesia
  - name: "blog"
    label: "🇮🇩 Artikel Indonesia (ID)"
    label_singular: "Artikel ID"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    view_filters:
      - label: "Semua Kategori"
        field: "categories"
        pattern: ".*"
      - label: "Strategi Bisnis"
        field: "categories"
        pattern: "Strategi Bisnis"
      - label: "Monetisasi"
        field: "categories"
        pattern: "Monetisasi"
      - label: "Funnel Penjualan"
        field: "categories"
        pattern: "Funnel Penjualan"
      - label: "Audience Growth"
        field: "categories"
        pattern: "Audience Growth"
      - label: "Email Marketing"
        field: "categories"
        pattern: "Email Marketing"
    view_groups:
      - label: "Kategori"
        field: "categories"
    fields:
      - label: "Bahasa"
        name: "lang"
        widget: "hidden"
        default: "id"
      - label: "Judul Artikel"
        name: "title"
        widget: "string"
        hint: "Judul utama artikel (menarik & jelas untuk SEO)"
      - label: "Deskripsi Singkat (SEO)"
        name: "description"
        widget: "text"
        hint: "Ringkasan 1-2 kalimat untuk meta description Google dan preview kartu blog"
      - label: "Tanggal & Jam Publikasi"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        picker_utc: false
        hint: "Waktu penayangan artikel (menentukan urutan postingan di homepage)"
      - label: "Kategori"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "Strategi Bisnis"
          - "Monetisasi"
          - "Funnel Penjualan"
          - "Audience Growth"
          - "Email Marketing"
      - label: "Tags / Kata Kunci"
        name: "tags"
        widget: "list"
        default: ["SitusBisnis"]
        hint: "Daftar kata kunci atau topik terkait artikel"
      - label: "Penulis"
        name: "author"
        widget: "string"
        default: "Tim SitusBisnis"
      - label: "Gambar Sampul (Cover)"
        name: "image"
        widget: "image"
        required: false
        hint: "Pilih file gambar atau SVG (otomatis diunggah ke folder /images/posts/)"
      - label: "Seri Artikel (Opsional)"
        name: "series"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "ID Seri (slug unik)"
            name: "id"
            widget: "string"
            required: false
          - label: "Nama Seri Lengkap"
            name: "name"
            widget: "string"
            required: false
          - label: "Bagian Ke (Part)"
            name: "part"
            widget: "number"
            value_type: "int"
            required: false
          - label: "Total Bagian"
            name: "totalParts"
            widget: "number"
            value_type: "int"
            required: false
      - label: "Isi Konten Artikel (Markdown)"
        name: "body"
        widget: "markdown"

  # 🇬🇧 2. English Articles Collection
  - name: "blog_en"
    label: "🇬🇧 English Articles (EN)"
    label_singular: "Article EN"
    folder: "src/content/blog/en"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    view_filters:
      - label: "All Categories"
        field: "categories"
        pattern: ".*"
      - label: "Business Strategy"
        field: "categories"
        pattern: "Business Strategy"
      - label: "Monetization"
        field: "categories"
        pattern: "Monetization"
      - label: "Sales Funnels"
        field: "categories"
        pattern: "Sales Funnels"
      - label: "Audience Growth"
        field: "categories"
        pattern: "Audience Growth"
      - label: "Email Marketing"
        field: "categories"
        pattern: "Email Marketing"
    view_groups:
      - label: "Category"
        field: "categories"
    fields:
      - label: "Language"
        name: "lang"
        widget: "hidden"
        default: "en"
      - label: "Translation Of (Indonesian Article File)"
        name: "translationOf"
        widget: "string"
        hint: "Nama file artikel Bahasa Indonesia padanannya (contoh: perbandingan-biaya-platform-jual-produk-digital-indonesia.md)"
      - label: "Article Title"
        name: "title"
        widget: "string"
        hint: "Primary English title optimized for search engines"
      - label: "SEO Meta Description"
        name: "description"
        widget: "text"
        hint: "1-2 sentence compelling summary for search results and cards"
      - label: "Publish Date & Time"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        picker_utc: false
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - "Business Strategy"
          - "Monetization"
          - "Sales Funnels"
          - "Audience Growth"
          - "Email Marketing"
      - label: "Tags / Keywords"
        name: "tags"
        widget: "list"
        default: ["SitusBisnis", "digital-business"]
      - label: "Author"
        name: "author"
        widget: "string"
        default: "SitusBisnis Editorial Team"
      - label: "Cover Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Series (Optional)"
        name: "series"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Series ID (slug)"
            name: "id"
            widget: "string"
            required: false
          - label: "Series Name"
            name: "name"
            widget: "string"
            required: false
          - label: "Part"
            name: "part"
            widget: "number"
            value_type: "int"
            required: false
          - label: "Total Parts"
            name: "totalParts"
            widget: "number"
            value_type: "int"
            required: false
      - label: "Body Content (Markdown)"
        name: "body"
        widget: "markdown"
